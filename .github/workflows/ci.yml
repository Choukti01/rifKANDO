name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:5000/api
      VITE_GOOGLE_CLIENT_ID: rifkando-ci.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rifKANDI-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: rifKANDI-backend/package-lock.json
      - run: npm ci
      - run: npm test

  withdrawal-retries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wallet_retry_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: npm ci
        working-directory: rifKANDI-backend
      - run: node scripts/withdrawalPostgresTest.js
        working-directory: rifKANDI-backend
        env:
          WALLET_TEST_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/wallet_retry_test

  security:
    name: Repository and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - run: npm run test:repository-hygiene
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: rifKANDI-backend
