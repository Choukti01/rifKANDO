name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rifKANDI-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: rifKANDI-backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:environment
      - run: npm run test:feature-flags
      - run: npm run test:performance-schema
      - run: npm run test:authorization
      - run: npm run test:sessions
      - run: npm run test:validation
      - run: npm run test:financial
      - run: npm run test:workflows
      - run: npm run test:money-migration
      - run: npm run test:audit
      - run: npm run test:storage
      - run: npm audit --omit=dev --audit-level=high
