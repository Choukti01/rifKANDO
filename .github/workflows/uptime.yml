name: Production readiness monitor

on:
  schedule:
    # Keeps private-repository Actions usage within the free allowance while
    # still detecting a full service outage within 30 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness:
    name: Storefront, API, database and storage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check public production dependencies
        run: node rifKANDI-backend/scripts/productionReadinessCheck.js
