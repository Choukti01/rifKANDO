name: rifkando

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rifkando-api:latest
    restart: unless-stopped
    env_file:
      - /opt/rifkando/.env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "5000"
      DATABASE_ENGINE: postgres
      POSTGRES_SSL: "true"
      PERSISTENT_STORAGE_ROOT: /var/lib/rifkando
      UPLOADS_DIR: /var/lib/rifkando/uploads
      DB_BACKUP_DIR: /var/lib/rifkando/backups
    # The API is deliberately private. Cloudflare Tunnel is its only internet
    # ingress, so the VM does not expose port 5000 to the public internet.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - rifkando_data:/var/lib/rifkando
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    networks:
      - rifkando_internal

  # Activate only after creating a replacement Cloudflare tunnel and placing
  # its scoped token in /opt/rifkando/.cloudflared.env (chmod 600).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      # Export this from /opt/rifkando/.cloudflared.env immediately before
      # starting the tunnel profile. Keeping the value out of this compose file
      # and the repository prevents an accidental credential disclosure.
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run --token $${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - rifkando_internal

volumes:
  rifkando_data:

networks:
  rifkando_internal:
    driver: bridge
