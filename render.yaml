services:
  - type: web
    name: rifkando-backend
    runtime: node
    rootDir: rifKANDI-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    disk:
      name: rifkando-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_PATH
        value: /var/data/rifkandi.db
      - key: CLIENT_URL
        value: https://www.rifkando.com
      - key: ALLOWED_ORIGINS
        value: https://www.rifkando.com,https://rifkando.com
      - key: DB_BACKUP_DIR
        value: /var/data/backups
      - key: DB_BACKUP_RETENTION_DAYS
        value: 14
      # Local storage is durable on this one Render instance. Before adding a
      # replica, switch to the configured two-bucket S3-compatible mode.
      - key: OBJECT_STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PRIVATE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUDIT_LOG_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: FEATURE_FLAGS
        value: checkout=true,cmi_payments=true,digital_downloads=true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: rifKANDO
      - key: CMI_STORE_KEY
        sync: false
      - key: CMI_CLIENT_ID
        sync: false
      - key: BACKEND_URL
        sync: false
